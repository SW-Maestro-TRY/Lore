// 백엔드 빌드 스크립트. 레포 전체에서 이 파일 하나뿐이다.
//
// 폴더는 도메인별로 나뉘어 있지만(common/be, webtoon/be, ...) 빌드는 하나로 합친다.
// 아래 srcDirs 가 흩어진 도메인 폴더를 하나의 컴파일 단위로 묶어주는 부분.
//
// 그래서 각 도메인 담당자는:
//   - 자기 폴더(예: zzal/be/src/main/java) 안에서만 작업하면 되고
//   - 공통 기능은 그냥 import 해서 쓰면 된다 (예: import com.lore.common.response.ApiResponse;)
//   - Gradle 모듈 / 의존성 선언을 몰라도 된다. 의존성은 아래 dependencies 한 곳에만 적는다.

plugins {
    id 'java'
    // Spring Boot 3.x 전 브랜치는 2026-06-30 오픈소스 지원 종료 → 4.1.0(현행 정식)로 확정.
    // 버전은 Maven Central 및 start.spring.io 실물 대조로 확인(2026-07-27).
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lore'
version = '0.0.1-SNAPSHOT'

java {
    // 팀 공용 Java 버전. 확정은 백엔드 담당자 판단에 맡김 (Spring Boot 버전과 함께 결정).
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 도메인별로 흩어진 소스 폴더를 하나로 묶는다.
// 새 도메인이 생기면 여기에 한 줄 추가하면 된다.
sourceSets {
    main {
        java {
            srcDirs = [
                'common/be/src/main/java',   // 공통: config, 인증, 공통 응답
                'webtoon/be/src/main/java',  // 하은
                'zzal/be/src/main/java',     // 상훈
                'trailer/be/src/main/java',  // 병연
                'apps/api/src/main/java'     // 서버 실행 진입점(main 클래스)
            ]
        }
        resources {
            srcDirs = ['apps/api/src/main/resources']  // application.yml 등 실행 설정
        }
    }
    test {
        java {
            srcDirs = [
                'common/be/src/test/java',
                'webtoon/be/src/test/java',
                'zzal/be/src/test/java',
                'trailer/be/src/test/java'
            ]
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 의존성은 도메인 구분 없이 여기 한 곳에만 적는다.
    //
    // ★ Spring Boot 4.x 주의 — 인터넷 자료 대부분이 3.x 기준이라 그대로 쓰면 깨진다.
    //   - starter-web  →  starter-webmvc 로 이름이 바뀌었다.
    //   - starter-test →  모듈별(webmvc-test / data-jpa-test / validation-test)로 쪼개졌다.
    //   아래 구성은 start.spring.io 가 Boot 4.1.0 + Java 21 로 생성한 공식 템플릿을 따랐다.

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 서버가 살아 있는지 알려주는 상태 확인 엔드포인트(/actuator/health).
    // 배포 직후 "떴는가" 확인, 앞단 게이트웨이(Nginx)·나중의 로드밸런서 헬스체크, CI/CD 배포 성공 판정에 쓴다.
    // 이게 없으면 확인에 일반 API 를 써야 해서 확인할 때마다 DB 조회가 발생한다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // API 문서(Swagger UI). 2.x 는 Boot 3.x 용이라 Boot 4 에서는 3.x 를 써야 한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    runtimeOnly 'org.postgresql:postgresql'

    // AWS S3 (v2) — 콘텐츠 이미지 presigned URL 발급용.
    // 실제 업로드는 브라우저 → S3 직접(presigned PUT)이라 서버(t3.micro)를 안 거친다.
    // BOM 으로 버전을 한 곳에서 관리한다.
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // spring-boot-starter-security 는 이번 스프린트에서 의도적으로 뺐다.
    // 넣는 순간 모든 요청이 로그인으로 튕겨 초기 개통 확인이 어려워진다.
    // 구글 OAuth 는 Security 4.x 설정 변경 폭이 커서 다음 스프린트로 미룸.
}

tasks.named('test') {
    useJUnitPlatform()
}
