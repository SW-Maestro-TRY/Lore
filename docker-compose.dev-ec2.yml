# dev EC2 전용 override — base 위에 nginx(80/443·TLS)만 얹는다.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev-ec2.yml up -d
#
# 노트북은 이 파일을 쓰지 않는다 — base 만으로 app(8080)·web(3000)·minio(9000)를
# localhost 로 직접 부른다. 박스에서만 한 도메인(dev.lorecomic.com) 아래로 묶어
# 같은 출처로 만들어(쿠키·CORS 문제 제거) presigned 업로드까지 통하게 한다.
#
# 인증서는 호스트에서 certbot 이 발급/갱신하고(webroot=/var/www/certbot),
# nginx 는 /etc/letsencrypt 와 그 webroot 를 읽기 전용으로 마운트만 한다.

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - web
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro          # certbot 발급 인증서(호스트)
      - /var/www/certbot:/var/www/certbot:ro          # ACME 챌린지 웹루트(갱신용, 호스트가 씀)
    networks:
      default:
        aliases:
          # ★ 컨테이너 안에서 dev.lorecomic.com 을 nginx 로 직접 보낸다.
          #   앱이 서버측 S3 업로드(생성 격자)를 https://dev.lorecomic.com/lore-content/ 로 하는데,
          #   EIP 헤어핀(자기 자신의 공인 IP)은 VPC 에서 막히는 경우가 많다. 도커 DNS 로 풀면
          #   nginx→minio 로 확실히 도달하고, Host=dev.lorecomic.com 이 보존돼 presign 서명도 맞는다.
          - dev.lorecomic.com
    restart: unless-stopped
