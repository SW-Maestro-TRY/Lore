# Lore dev EC2 전용 nginx.
#
# 역할: TLS 종단 + 한 도메인(dev.lorecomic.com) 아래로 app/web/minio 를 묶는다.
#       같은 출처가 되므로 HttpOnly 쿠키 인증과 presigned 업로드가 문제없이 돈다.
#
#   /api/                → app:8080    (접두어 /api 그대로 넘김, Host 보존)
#   /images/             → minio:9000  (버킷 안 images/ 로 되짚어 줌 — 운영의 CloudFront /images/* 와 같은 자리)
#   /lore-content/       → minio:9000  (Host 보존 — presigned 서명 검증 통과)
#   /                    → web:3000
#
# ★ /lore-content/ 와 /images/ 의 버킷 이름은 .env 의 CONTENT_BUCKET 과 같아야 한다.
#   nginx 는 env 치환을 하지 않으므로 여기 경로는 리터럴이다. CONTENT_BUCKET 을 바꾸면 이 두 줄도 바꾼다.

# ★ upstream 블록을 쓰지 않는다 — 이름을 기동할 때 한 번만 IP 로 풀어 버려서, app·web 만 다시 만들면
#   (IP 가 바뀜) nginx 가 옛 IP 를 계속 찔러 502 가 났다(2026-09-20 #337 배포, 2026-10-09 채팅 켜고 app 만 재생성).
#   대신 도커 내장 DNS(127.0.0.11)를 resolver 로 두고 proxy_pass 에 "변수"를 쓴다 → 요청 때마다(최대 10초 캐시)
#   서비스 이름을 다시 푼다. 손으로 `up -d app` 을 해도 10초 안에 새 IP 로 붙는다.
#   덤: 기동 순간 app 이 아직 없어도 nginx 가 "host not found in upstream" 으로 죽지 않는다.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ── http : https 로 넘기되, ACME 갱신 통로만 http 로 열어 둔다 ──
server {
    listen 80;
    listen [::]:80;
    server_name dev.lorecomic.com;

    # certbot 갱신(webroot 방식)용 — 이 경로만 http 로 응답한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── https : 실제 서비스 ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.lorecomic.com;

    ssl_certificate     /etc/letsencrypt/live/dev.lorecomic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.lorecomic.com/privkey.pem;

    # 서버가 만들어 내는 그림·움짤이 크다. 업로드 상한을 넉넉히 잡는다.
    client_max_body_size 50m;

    # 업스트림 주소(서비스 이름). 변수라서 요청마다 resolver 로 풀린다(위 주석).
    set $up_app   http://app:8080;
    set $up_web   http://web:3000;
    set $up_minio http://minio:9000;

    # ── 백엔드 ── /api 접두어를 그대로 넘긴다(앱이 /api 아래에서 받는다).
    location /api/ {
        proxy_pass $up_app;            # 변수 + URI 없음 → 요청 경로(/api/...)를 그대로 넘긴다
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 그림(읽기 전용) ── 화면은 ${CDN}/zzal/... = /images/zzal/... 로 그림을 부른다
    #   (zzal/fe/lib/assets.ts 의 NEXT_PUBLIC_CDN_BASE 기본값이 "/images").
    #   staging·prod 는 CloudFront 가 /images/* 를 S3 로 보내 주지만, dev 박스에는 그 자리가
    #   없어 배경·소품·시연 그림이 전부 404 였다. 버킷 안의 같은 키(images/...)로 되짚어 준다.
    #
    #   버킷은 공개 읽기(minio-init 의 `mc anonymous set download`)라 서명이 없다 —
    #   그래서 여기서는 Host 보존이 서명과 무관하지만, /lore-content/ 와 같은 헤더를 유지한다.
    #   변수 proxy_pass 는 "접두어 바꿔치기"(proxy_pass http://x/lore-content/images/)를 못 한다 → rewrite 로 옮겼다.
    location /images/ {
        rewrite ^/images/(.*)$ /lore-content/images/$1 break;
        proxy_pass $up_minio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 그림 키는 판(버전)이 바뀌면 이름도 바뀐다 — 운영의 CloudFront(1년 불변)와 같이 잡는다.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── 콘텐츠 버킷(MinIO) ── presigned PUT 업로드 + 이미지 서빙.
    # ★ Host 를 반드시 보존한다 — MinIO 는 MINIO_SERVER_URL(dev.lorecomic.com) 기준으로
    #   presigned 서명을 검증한다. Host 가 바뀌면 서명 불일치로 403 이 난다.
    #   rewrite 를 하지 않으므로 클라이언트가 보낸 경로·쿼리(서명) 그대로 넘어간다.
    location /lore-content/ {
        proxy_pass $up_minio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 프론트(Next.js) ── 나머지 전부.
    location / {
        proxy_pass $up_web;
        # Next.js 가 link: 프리로드 헤더를 6KB 넘게 보내 nginx 기본 4k 버퍼를 넘는다.
        # 안 두면 /zzal 만 502(staging 에서 9/20 같은 증상). ALB 에는 이 제한이 없어 prod 는 해당 없음.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
