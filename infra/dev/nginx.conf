# Lore dev EC2 전용 nginx.
#
# 역할: TLS 종단 + 한 도메인(dev.lorecomic.com) 아래로 app/web/minio 를 묶는다.
#       같은 출처가 되므로 HttpOnly 쿠키 인증과 presigned 업로드가 문제없이 돈다.
#
#   /api/                → app:8080    (접두어 /api 그대로 넘김, Host 보존)
#   /lore-content/       → minio:9000  (Host 보존 — presigned 서명 검증 통과)
#   /                    → web:3000
#
# ★ /lore-content/ 는 .env 의 CONTENT_BUCKET 과 같아야 한다. nginx 는 env 치환을
#   하지 않으므로 여기 경로는 리터럴이다. CONTENT_BUCKET 을 바꾸면 이 줄도 바꾼다.

upstream lore_app   { server app:8080; }
upstream lore_web   { server web:3000; }
upstream lore_minio { server minio:9000; }

# ── http : https 로 넘기되, ACME 갱신 통로만 http 로 열어 둔다 ──
server {
    listen 80;
    listen [::]:80;
    server_name dev.lorecomic.com;

    # certbot 갱신(webroot 방식)용 — 이 경로만 http 로 응답한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── https : 실제 서비스 ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.lorecomic.com;

    ssl_certificate     /etc/letsencrypt/live/dev.lorecomic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.lorecomic.com/privkey.pem;

    # 서버가 만들어 내는 그림·움짤이 크다. 업로드 상한을 넉넉히 잡는다.
    client_max_body_size 50m;

    # ── basic auth ── dev 박스는 아직 비공개다. 서버 전체에 기본 인증을 건다.
    #   자격은 호스트에서 .env(LORE_DEV_BASICAUTH_USER/PASS)로 만든 htpasswd 파일을 참조한다
    #   (평문 비밀번호를 여기 적지 않는다). 파일은 compose override 가 /etc/nginx/htpasswd 로 마운트한다.
    #   ★ 예외 둘은 아래에서 auth_basic off 로 푼다:
    #     · /.well-known/acme-challenge/ — :80 server 에만 있어 여긴 해당 없음(인증서 갱신 통로)
    #     · /lore-content/               — presign 업로드는 서명을 스스로 들고 오고, 서버측 S3 업로드도
    #                                       기본 인증 헤더가 없다. 여기에 기본 인증을 걸면 업로드가 401 로 막힌다.
    auth_basic           "Lore dev";
    auth_basic_user_file /etc/nginx/htpasswd;

    # ── 백엔드 ── /api 접두어를 그대로 넘긴다(앱이 /api 아래에서 받는다).
    location /api/ {
        proxy_pass http://lore_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 콘텐츠 버킷(MinIO) ── presigned PUT 업로드 + 이미지 서빙.
    # ★ Host 를 반드시 보존한다 — MinIO 는 MINIO_SERVER_URL(dev.lorecomic.com) 기준으로
    #   presigned 서명을 검증한다. Host 가 바뀌면 서명 불일치로 403 이 난다.
    location /lore-content/ {
        # presign 업로드/서버측 업로드는 자체 서명을 들고 온다 — 기본 인증에서 제외한다.
        auth_basic off;
        proxy_pass http://lore_minio;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 프론트(Next.js) ── 나머지 전부.
    location / {
        proxy_pass http://lore_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
