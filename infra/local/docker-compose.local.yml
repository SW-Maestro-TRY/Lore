# Lore 로컬 풀스택 — 브랜치(기능)마다 따로 뜨는 스택.
#
# 직접 부르지 않는다. scripts/dev.sh 가 아래 값을 채워서 부른다.
#   docker compose -p lore-<스택> -f infra/local/docker-compose.local.yml --env-file ~/.lore-dev/<스택>/.env ...
#
# dev 박스(dev.lorecomic.com)용 docker-compose.yml 과는 별개 파일이다.
#   - 박스용은 포트가 5432·8080·3000 으로 고정이라 스택을 둘 띄우면 부딪힌다.
#   - 여기는 포트를 전부 변수로 받는다(WEB_PORT 32NN · API_PORT 82NN · PG_PORT 54NN · MINIO_PORT 90NN).
#   - 컨테이너·네트워크·볼륨 이름은 project(-p lore-<스택>)가 앞에 붙어 스택끼리 안 섞인다.
#
# 볼륨(pgdata·miniodata)은 `dev.sh down` 으로 안 지워진다 → 테스트 계정·펫이 재기동 뒤에도 남는다.
# 지우는 건 `dev.sh reset` 하나뿐이다.

services:
  # ── DB ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 필요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:?PG_PORT 필요}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d lore"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  # ── 오브젝트 스토리지(MinIO) ──────────────────────────────────────
  # ★ 컨테이너 안에서도 호스트와 같은 포트(MINIO_PORT)로 듣는다. 그리고 s3.lore.localhost 라는
  #   별명을 단다. 그래서 S3_PUBLIC_URL=http://s3.lore.localhost:<MINIO_PORT> 하나가
  #     - 브라우저·호스트: *.localhost → 127.0.0.1 → 포트 매핑 → MinIO
  #     - app 컨테이너  : 도커 DNS 별명 → MinIO 컨테이너
  #   양쪽에서 같은 주소가 된다. presign 서명 주소와 앱의 직접 업로드가 둘 다 맞는다.
  #   (박스용 compose 의 S3_PUBLIC_URL=http://localhost:9000 은 컨테이너 안에서 자기 자신이라 앱 업로드가 실패했다)
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --address ":${MINIO_PORT:?MINIO_PORT 필요}" --console-address ":9999"   # 콘솔은 안 연다. 9001 이면 NN=01 의 API 포트와 부딪힌다
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY 필요}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY 필요}
      MINIO_SERVER_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL 필요}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_PORT}:${MINIO_PORT}"
    networks:
      default:
        aliases:
          - s3.lore.localhost
    mem_limit: 512m
    restart: unless-stopped

  # 버킷 만들고 공개 읽기로(운영의 CloudFront /images/* 공개와 같은 자리). 한 번 돌고 끝.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CONTENT_BUCKET: ${CONTENT_BUCKET:?CONTENT_BUCKET 필요}
      MINIO_PORT: ${MINIO_PORT}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local "http://minio:$$MINIO_PORT" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null; do
          echo 'minio 기다리는 중...'; sleep 2;
        done;
        mc mb --ignore-existing local/"$$CONTENT_BUCKET";
        mc anonymous set download local/"$$CONTENT_BUCKET";
        echo "버킷 준비 완료: $$CONTENT_BUCKET"

  # 공통 그림(배경·소품·알·여울 시연·온보딩 예시·랜딩 썸네일)을 버킷에 넣는다. 한 번 돌고 끝.
  # 화면은 /images/zzal/... 로 그림을 부르는데 MinIO 는 빈 통으로 뜬다 → 안 채우면 전부 404(깨진 그림).
  # 내려받기는 dev.sh 가 호스트에서 한 번만 한다(staging CloudFront 공개 주소 → ~/.lore-dev/assets,
  # 목록 = infra/dev/seed-assets.txt, dev 박스와 같은 목록). 여기서는 그 캐시를 키 그대로 올리기만 한다.
  # mc mirror 는 이미 있는 키를 건너뛰므로 재기동해도 안전하다. 실패해도 스택은 뜬다(exit 0).
  minio-seed:
    image: quay.io/minio/mc:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CONTENT_BUCKET: ${CONTENT_BUCKET}
      MINIO_PORT: ${MINIO_PORT}
    volumes:
      - ${ASSET_CACHE:?ASSET_CACHE 필요}:/seed/data:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local "http://minio:$$MINIO_PORT" "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null || exit 0;
        if [ -d /seed/data/images ]; then
          mc mirror --quiet /seed/data/images local/"$$CONTENT_BUCKET"/images || echo '[seed] 업로드 일부 실패 — 스택은 계속 뜹니다';
        else
          echo '[seed] 캐시가 비었습니다 — 그림 없이 뜹니다(scripts/dev.sh assets 로 다시 받기)';
        fi;
        echo "[seed] 버킷 그림 수: $$(mc ls --recursive local/$$CONTENT_BUCKET/images/zzal 2>/dev/null | wc -l)";
        exit 0

  # ── 백엔드(Spring Boot) ───────────────────────────────────────────
  app:
    build:
      context: ../..
      dockerfile: infra/dev/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      minio-seed:
        condition: service_completed_successfully
    environment:
      LORE_ENV: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lore
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_S3_ENDPOINT: ${S3_PUBLIC_URL}
      CONTENT_S3_BUCKET: ${CONTENT_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # 스택마다 다른 서명 키(dev.sh 가 스택 이름으로 만든다). 같은 localhost 에 스택이 여럿이어도
      # 다른 스택의 쿠키 토큰은 여기서 무효(401)가 되어 엉뚱한 사용자 번호로 붙지 않는다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요}
      COOKIE_SECURE: "false"
      # ── 돈 나가는 스위치는 기본 꺼짐 ──
      ZZAL_OPENAI_API_KEY: ${OPENAI_KEY:-}
      ZZAL_GENERATION_REAL: ${ZZAL_GENERATION_REAL:-false}
      ZZAL_CHAT_LLM: ${ZZAL_CHAT_LLM:-true}   # 키가 없으면 앱이 스스로 끈다(LORE_ENV=dev 는 기동 막지 않음)
      ZZAL_REAL_POSTPROCESS: ${ZZAL_REAL_POSTPROCESS:-false}
      # ── 로컬 기본 켜짐: 리모컨(dev API)·관리자 화면 ──
      ZZAL_DEV_TOOLS: ${ZZAL_DEV_TOOLS:-true}
      ZZAL_ADMIN: ${ZZAL_ADMIN:-true}
      ZZAL_ADMIN_TOKEN: ${ZZAL_ADMIN_TOKEN:-}
      ZZAL_ADMIN_BOT_USER_ID: ${ZZAL_ADMIN_BOT_USER_ID:-0}
      # ── 웹툰 만들기(선택. 비우면 만들기만 멈춘다) ──
      LORE_WEBTOON_PYTHON_BIN: ${LORE_WEBTOON_PYTHON_BIN:-/opt/lore/venv-webtoon/bin/python}
      WEBTOON_API_KEY: ${WEBTOON_API_KEY:-}
      LORE_WEBTOON_INTERNAL_TOKEN: ${LORE_WEBTOON_INTERNAL_TOKEN:-}
      NH_PROVIDER: ${NH_PROVIDER:-}
      NH_STORY_AXES: ${NH_STORY_AXES:-}
      NH_STORY_ENGINES: ${NH_STORY_ENGINES:-}
      # 링크 기준 주소는 이 스택의 웹 포트를 가리킨다.
      LORE_WEBTOON_SITE_URL: ${SITE_URL}
      ZZAL_SHARE_BASE_URL: ${SITE_URL}/zzal/s
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      # 컨테이너 메모리 상한(mem_limit) 안에서 힙을 잡는다. 기본 25% 는 너무 작다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT 필요}:8080"
    volumes:
      - webtoonwork:/app/webtoon/ai/work
    healthcheck:
      # 런타임 이미지엔 curl 이 없을 수 있어 이미 깔린 python3 로 본다.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/actuator/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 2g
    restart: unless-stopped

  # ── 프론트(Next.js standalone) ────────────────────────────────────
  # 화면은 /api 를 상대경로로 부른다(common/fe/api/client.ts 의 NEXT_PUBLIC_API_BASE 기본값 '').
  # Next rewrite 가 /api → app:8080 으로 넘긴다. app 은 스택 안의 서비스 이름이라 스택마다 따로 붙는다.
  # 그래서 웹 포트가 3201 이든 3202 든 프론트에 주소를 따로 넣을 필요가 없다.
  web:
    build:
      context: ../..
      dockerfile: infra/dev/Dockerfile.web
      args:
        API_PROXY: http://app:8080
        # /images → MinIO(minio-seed 가 채운 버킷). 운영에선 CloudFront 가 하는 일을 로컬에선 Next rewrite 가 한다.
        # next.config.mjs 의 IMAGE_PROXY 규칙 — 이 값을 안 주는 CI·배포 빌드엔 꺼져 있다.
        IMAGE_PROXY: http://minio:${MINIO_PORT}/${CONTENT_BUCKET}/images
        NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY:-}
    depends_on:
      - app
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT 필요}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  webtoonwork:
