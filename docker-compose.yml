# Lore 개발용 self-contained 스택 (base).
#
# 같은 compose 가 개발자 노트북과 dev EC2 양쪽에서 돈다 — 차이는 .env 하나뿐이다.
#   노트북 : docker compose --env-file infra/dev/.env up --build   (→ http://localhost:3100)
#   dev EC2: docker compose -f docker-compose.yml -f docker-compose.dev-ec2.yml up -d
#            (override 가 nginx(80/443·TLS)를 얹는다)
#
# RDS→postgres, S3→minio 로 통째로 대체해 외부 AWS 자원 없이 앱 전체가 뜬다.
# 환경변수 목록·노트북/박스 차이는 infra/dev/env.example 참고.

name: lore-dev

services:
  # ── DB (RDS 대체) ────────────────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lore                     # application.yml 의 jdbc URL(.../lore)과 같아야 한다
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"                         # 로컬에서 DB 를 직접 들여다볼 때만 필요
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d lore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 오브젝트 스토리지 (S3 대체) ──────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # ★ presigned URL 이 프록시(nginx) 뒤에서도 맞물리게 "공개 주소"를 알려준다.
      #   이 주소로 서명이 계산되므로 브라우저가 실제로 닿는 주소와 같아야 한다.
      #   노트북=http://localhost:9000 · dev EC2=https://dev.lorecomic.com
      MINIO_SERVER_URL: ${S3_PUBLIC_URL}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"                         # S3 API (presigned 업로드/서빙)
      - "9001:9001"                         # 웹 콘솔

  # ── 버킷 초기화 (한 번 돌고 끝) ──────────────────────────────────
  # 콘텐츠 버킷을 만들고, 이미지가 공개로 읽히게 한다(운영의 CloudFront /images/* 공개와 동일).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CONTENT_BUCKET: ${CONTENT_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          echo 'minio 기다리는 중...'; sleep 2;
        done;
        mc mb --ignore-existing local/"$$CONTENT_BUCKET";
        mc anonymous set download local/"$$CONTENT_BUCKET";
        echo "버킷 준비 완료: $$CONTENT_BUCKET"

  # ── 정적 그림 씨뿌리기 1/2 : 내려받기 ────────────────────────────
  # MinIO 는 빈 통으로 뜨는데 화면은 배경·소품·여울 시연·온보딩·랜딩 썸네일이 버킷에
  # 있다고 가정하고 /images/zzal/... 를 부른다 → 안 채우면 전 화면이 깨진 그림이다.
  # staging CloudFront(공개)에서 같은 키를 그대로 받아 온다 — AWS 자격이 필요 없다.
  # 목록 = infra/dev/seed-assets.txt (118개). 실패해도 스택은 뜬다(경고만 찍고 exit 0).
  seed-fetch:
    image: curlimages/curl:latest
    user: "0:0"                             # 명명 볼륨이 root 소유로 생긴다 — 기본 유저는 못 쓴다
    environment:
      SEED_BASE_URL: ${SEED_BASE_URL:-https://staging.lorecomic.com}
    volumes:
      - seeddata:/seed/data
      - ./infra/dev/seed-assets.txt:/seed/seed-assets.txt:ro
      - ./infra/dev/seed-assets.sh:/seed/seed-assets.sh:ro
    entrypoint: ["/bin/sh", "/seed/seed-assets.sh"]

  # ── 정적 그림 씨뿌리기 2/2 : 버킷에 올리기 ───────────────────────
  # 받아 둔 파일을 키 그대로 버킷에 넣는다. mc mirror 는 이미 있는 키를 건너뛰므로
  # 다시 올려도 안전하다(멱등). 버킷 준비(minio-init)와 내려받기가 모두 끝난 뒤에 돈다.
  minio-seed:
    image: quay.io/minio/mc:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
      seed-fetch:
        condition: service_completed_successfully
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CONTENT_BUCKET: ${CONTENT_BUCKET}
    volumes:
      - seeddata:/seed/data:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || exit 0;
        mc mirror /seed/data local/"$$CONTENT_BUCKET" || echo '[seed] 업로드 일부 실패 — 스택은 계속 뜹니다';
        mc du local/"$$CONTENT_BUCKET"/images/zzal || true;
        exit 0

  # ── 백엔드 (Spring Boot) ─────────────────────────────────────────
  app:
    build:
      context: .                            # 도메인 소스가 레포 전체에 흩어져 있어 컨텍스트=루트
      dockerfile: infra/dev/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      LORE_ENV: dev
      # DB — 컨테이너 이름 postgres 로 붙는다(SPRING_DATASOURCE_URL 이 yml 기본값을 덮는다)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lore
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # S3(MinIO) — endpoint 를 채우면 S3Config 가 경로 방식으로 MinIO 에 붙는다
      APP_S3_ENDPOINT: ${S3_PUBLIC_URL}
      CONTENT_S3_BUCKET: ${CONTENT_BUCKET}  # application.yml 의 app.s3.content-bucket 이 읽는 이름
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # DefaultCredentialsProvider 가 이 두 환경변수를 집어 MinIO 루트 키로 쓴다
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # zzal 생성 OpenAI 키(비우면 가짜 모드 — 돈 안 나감)
      ZZAL_OPENAI_API_KEY: ${OPENAI_KEY:-}
      # ★ 실제 OpenAI 호출 스위치(app.zzal.generation.real). 이 값을 안 넘기면 키가 있어도
      #   application.yml 기본값(false)이라 가짜 모드로 뜬다. .env 의 ZZAL_GENERATION_REAL 로 켠다.
      ZZAL_GENERATION_REAL: ${ZZAL_GENERATION_REAL:-false}
      # 파이썬 후처리 실제 실행(돈 안 남). 슬림 JRE 이미지엔 numpy/scipy/PIL 이 없어 켜면 기동이 막힌다 → 기본 꺼짐.
      ZZAL_REAL_POSTPROCESS: ${ZZAL_REAL_POSTPROCESS:-false}
      # ── 웹툰 만들기 ────────────────────────────────────────────────
      # 하네스를 돌릴 파이썬(lore.webtoon.python.bin). 이미지가 심어 둔 두 번째 가상환경을
      # 가리킨다 — zzal 것(/opt/lore/venv)에는 openai·google-genai·PyYAML 이 없다.
      # 박스와 같은 경로라 .env 로 바꿀 일이 거의 없지만 덮을 수는 있게 둔다.
      LORE_WEBTOON_PYTHON_BIN: ${LORE_WEBTOON_PYTHON_BIN:-/opt/lore/venv-webtoon/bin/python}
      # 하네스가 그림·이야기를 부를 때 쓰는 열쇠. 자바 프로세스 환경으로 들어가 파이썬이
      # 물려받고, llm.py 가 OPENAI_API_KEY 로 풀어 쓴다. 비우면 만들기가 그 자리에서 멈춘다.
      WEBTOON_API_KEY: ${WEBTOON_API_KEY:-}
      # 하네스가 다 그린 그림을 올리고 비용을 적을 때 서버에 대는 한 마디
      # (lore.webtoon.internal-token · upload/s3_upload.py). 비우면 S3 에는 올라가도
      # 주소가 DB 에 안 적힌다.
      LORE_WEBTOON_INTERNAL_TOKEN: ${LORE_WEBTOON_INTERNAL_TOKEN:-}
      # 완성 알림 메일에 들어가는 기준 주소(lore.webtoon.site-url). 안 주면 운영 주소가 박힌다.
      LORE_WEBTOON_SITE_URL: ${LORE_WEBTOON_SITE_URL:-http://localhost:3100}
      # 메일 계정(선택). 비워도 뜨도록 빈 기본값을 준다 — 안 주면 yml 의 ${MAIL_USERNAME}
      # 플레이스홀더가 안 풀려 기동이 막힌다.
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # http(노트북)에서는 Secure 쿠키가 저장 안 되므로 false. https(박스)는 .env 에서 true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 공유 링크의 기준 주소. 안 넘기면 application.yml 기본값(http://localhost:3100/zzal/s)이라
      # 박스에서 만든 링크가 노트북 주소를 가리킨다 → .env 에서 박스 주소로 바꾼다.
      ZZAL_SHARE_BASE_URL: ${ZZAL_SHARE_BASE_URL:-http://localhost:3100/zzal/s}
      # 메일 계정을 안 주면 SMTP 헬스 인디케이터가 연결 실패로 DOWN → /actuator/health 가 503 이 된다.
      # 개발 스택은 메일을 안 쓰므로 이 헬스 검사만 끈다(앱 기능·다른 헬스는 그대로).
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8080:8080"

  # ── 프론트엔드 (Next.js standalone) ──────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/dev/Dockerfile.web
      args:
        # base(노트북)엔 nginx 가 없어 Next rewrite 로 /api → app:8080 프록시를 굽는다.
        # dev EC2 는 nginx 가 /api 를 먼저 잡으므로 이 값이 쓰이지 않는다(무해).
        API_PROXY: http://app:8080
        # 같은 이유로 /images → MinIO 도 Next 가 대신 넘겨 준다.
        # 화면은 ${CDN}/zzal/... = /images/zzal/... 로 그림을 부르는데(assets.ts 기본값),
        # 노트북엔 그 주소를 받아 줄 자리가 없어 전부 404 가 난다. dev EC2 는 nginx
        # location /images/ 가 먼저 잡으므로 이 값이 쓰이지 않는다(무해).
        IMAGE_PROXY: http://minio:9000/${CONTENT_BUCKET}/images
    depends_on:
      - app
    ports:
      # ★ 3100 이 노트북의 기준 주소다 — application.yml 의 app.zzal.share.base-url
      #   기본값이 http://localhost:3100/zzal/s 라, 여기가 3000 이면 공유 링크가 죽는다.
      - "3100:3000"

volumes:
  pgdata:
  miniodata:
  seeddata:        # 씨뿌리기용 내려받기 캐시 — 두 번째 기동부터는 다시 안 받는다
