<!doctype html>
<html data-lore-base="/webtoon" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE — 웹툰을 만들고 있습니다</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
</head>
<body data-view="running">

<!-- 기다리는 화면 목업. index.html #progress 의 사본이라 마크업이 같아야
     한다 — 본편이 바뀌면 여기도 같이 고친다. 다른 것은 진행이 가짜라는
     것뿐이고, 화면에는 그 사실이 안 보인다. -->
<section id="progress" class="progress">
  <div class="progress-inner">

    <header class="progress-head">
      <div class="stage-now">
        <div class="stage-art" id="stageArt" data-stage="story" aria-hidden="true"></div>
        <p class="stage-say" id="mascotLine">루가 이야기를 만들고 있어요</p>
        <div class="lou-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="louProgress">
          <div class="lou-bar"><i id="louBarFill"></i></div>
          <span class="lou-pct" id="louPct">0%</span>
        </div>
        <p class="stage-clock">
          <span class="clock-time" id="clock">0:00</span>
          <span class="clock-label">경과</span>
        </p>
        <details class="stage-detail">
          <summary>지금 하고 있는 일 자세히</summary>
          <ol class="rail" id="rail"></ol>
        </details>
        <!-- 본편과 같은 자리·같은 모양. 여기서 나가면 본편의 둘러보기로 간다 —
             떠 있는 진행 표시(#miniProg)는 **실제로 도는 작업이 있을 때만** 뜨는
             것이라, 진행이 가짜인 이 목업에서는 안 나온다. -->
        <button type="button" class="btn btn-quiet btn-sm stage-away" id="progBrowse">
          기다리는 동안 다른 웹툰 둘러보기 →
        </button>
      </div>

    </header>

    <div class="play">
      <div class="mascot-stage" id="mascotStage">
        <button type="button" class="mascot" id="mascot" aria-label="루를 눌러 보기">
          <img id="mascotImg" src="/static/lou/react/idle/01.webp" alt="" draggable="false">
        </button>
      </div>
      <p class="play-say" id="playSay">루를 눌러 보세요</p>
      <p class="play-hint" id="playHint">누르기 · 연달아 누르기 · 꾹 누르기 · 끌어당기기 · 잡고 흔들기</p>
      <button type="button" class="btn btn-quiet btn-sm" id="shakeAllow" hidden>흔들기 켜기</button>
    </div>

    <div class="tips" id="tips" hidden aria-live="polite">
      <span class="tip-kind" id="tipKind">팁</span>
      <p class="tip-text" id="tipText"></p>
    </div>

    <!-- 본편(index.html)과 같은 자리·같은 모양. 되돌릴 수 없는 일은 화면
         한가운데가 아니라 찾아가서 눌러야 하는 자리에 둔다. -->
    <div class="cancel-row">
      <button type="button" class="btn btn-danger btn-sm" id="cancelBtn">만들기 중단</button>
    </div>
  </div>
</section>

<!-- 본편과 같은 확인 창. 목업이라 실제로 멈출 것은 없고 홈으로 나간다. -->
<div class="modal-veil" id="cancelModal" hidden>
  <div class="modal-box modal-narrow" role="dialog" aria-modal="true"
       aria-labelledby="cancelModalTitle">
    <h3 id="cancelModalTitle">정말로 중단하시겠습니까?</h3>
    <p class="cancel-warn"><b>크레딧은 환불되지 않습니다.</b></p>
    <p class="cancel-sub">지금까지 그려 둔 장은 그대로 남습니다 — 편집실에서 볼 수 있습니다.</p>
    <div class="cancel-actions">
      <button type="button" class="btn btn-quiet" id="cancelKeep">계속 만들기</button>
      <button type="button" class="btn btn-danger" id="cancelConfirm">중단하기</button>
    </div>
  </div>
</div>

<script src="/static/base.js"></script>
<script src="/static/demo-api.js"></script>
<script>
  // demo 는 app.js 를 안 불러온다 — 여기 없는 요소를 배선하다 죽는다.
  // 그래서 같은 동작을 작게 다시 쓴다(본편이 바뀌면 여기도 맞춰야 한다).
  (function () {
    var modal = document.getElementById("cancelModal");
    document.getElementById("cancelBtn").addEventListener("click", function () {
      modal.hidden = false;
      document.getElementById("cancelKeep").focus();
    });
    document.getElementById("cancelKeep").addEventListener("click", function () {
      modal.hidden = true;
    });
    modal.addEventListener("click", function (e) {
      if (e.target === modal) modal.hidden = true;
    });
    document.getElementById("cancelConfirm").addEventListener("click", function () {
      location.href = LORE.HOME;
    });
    // 목업에는 둘러보기 화면이 없다 — 본편의 둘러보기로 그대로 보낸다.
    document.getElementById("progBrowse").addEventListener("click", function () {
      location.href = LORE.at("/works");
    });
  })();
</script>

<!-- 루와 노는 자리는 본편과 **같은 파일**을 쓴다. 예전에는 여기에 같은 로직을
     베껴 뒀다가 본편이 바뀔 때마다 둘이 갈라졌다. -->
<script src="/static/lou-art.js"></script>
<script src="/static/lou-play.js"></script>
<script>
/* 데모 대본 — 진행만 가짜로 돌린다. app.js 는 안 부른다(여기 없는 요소를
   배선하다 죽는다). 루는 위 lou-play.js 의 setupLou() 가 맡는다. */
(() => {
  const $ = s => document.querySelector(s);
  const art = $("#stageArt"), say = $("#mascotLine");

  // pipeline.py 의 STAGE_SPEC 을 데모용으로 줄여 옮긴 것 — 본편이 바뀌면 여기도.
  const SPEC = [
    { key: "story", title: "이야기 설계", desc: "캐릭터에서 이야기를 만듭니다",
      say: "루가 이야기를 만들고 있어요",
      steps: ["사진에서 외형 읽기", "장르·세계관 정하기", "캐릭터 카드 쓰기",
              "이야기 뼈대 세우기", "구조 검수", "첫 장면 쓰기"] },
    { key: "sheet", title: "캐릭터 시트", desc: "컷마다 같은 얼굴이 나오도록 기준 그림을 만듭니다",
      say: "루가 캐릭터를 디자인하고 있어요",
      steps: ["외형 사양 정리", "시트 그리기", "기준 시트 확정"] },
    { key: "board", title: "회차 설계 · 콘티", desc: "1화를 컷으로 나누고 대사를 붙입니다",
      say: "루가 콘티를 짜고 있어요",
      steps: ["큰 줄거리", "1화 설계", "연출 검사", "컷 나누기"] },
    { key: "art", title: "그림 그리기", desc: "한 장에 3컷씩 그립니다",
      say: "루가 그림을 그리고 있어요",
      steps: ["장면 서술 옮기기", "3컷씩 묶기", "장 그리기"] },
    { key: "bind", title: "한 편으로 잇기", desc: "그린 장을 순서대로 세로로 이어 붙입니다",
      say: "루가 완성도를 확인하고 있어요",
      steps: ["이어 붙이기"] },
  ];
  const STAGES = SPEC.map(x => x.key);

  // 토글을 열면 보이는 자세한 자리. 진행 중인 단계만 안쪽 항목을 편다.
  function paintRail(active, frac) {
    $("#rail").innerHTML = SPEC.map((st, n) => {
      const state = n < active ? "done" : n === active ? "active" : "todo";
      const mark = state === "done" ? "✓" : String(n + 1).padStart(2, "0");
      const cut = Math.round(st.steps.length * frac);
      const steps = state === "active" ? `<ul class="steps">${st.steps.map((label, k) => `
          <li data-state="${k < cut ? "done" : "todo"}">
            <span class="tick">${k < cut ? "✓" : ""}</span>${label}
          </li>`).join("")}</ul>` : "";
      return `
        <li class="stage" data-state="${state}">
          <span class="stage-dot">${mark}</span>
          <div class="stage-main">
            <h3>${st.title}</h3>
            <p class="stage-desc">${st.desc}</p>
            ${steps}
          </div>
        </li>`;
    }).join("");
  }
  let i = 0, pct = 2;
  const started = Date.now();

  function paint() {
    art.dataset.stage = SPEC[i].key;
    say.textContent = SPEC[i].say;
    $("#louBarFill").style.width = pct + "%";
    $("#louPct").textContent = pct + "%";
    $("#louProgress").setAttribute("aria-valuenow", String(pct));
    const lo = i / STAGES.length * 100, hi = (i + 1) / STAGES.length * 100;
    paintRail(i, Math.max(0, Math.min(1, (pct - lo) / (hi - lo))));
  }

  // 진행 — 단계 경계를 넘으면 다음 단계로. 끝까지 가면 처음으로 돌아간다
  // (구경하는 화면이라 계속 돈다).
  setInterval(() => {
    pct += 1;
    const bound = (i + 1) / STAGES.length * 100;
    if (pct >= bound) {
      i += 1;
      if (i >= STAGES.length) { i = 0; pct = 2; }
    }
    paint();
  }, 700);

  setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    $("#clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);

  paint();
  setupLou();
  setupTips();
})();
</script>
</body>
</html>
