# 서버 실행 설정.
#
# ★ 비밀번호는 이 파일에 직접 적지 않는다. 환경변수로만 주입한다.
#   이 파일은 깃에 올라가므로 값을 적으면 그대로 공개된다.
#
# 로컬 실행에 필요한 환경변수 (각자 자기 기계에 설정):
#   DB_URL       예) jdbc:postgresql://localhost:5432/lore
#   DB_USERNAME  예) lore
#   DB_PASSWORD  각자 로컬 DB 비밀번호
#
# URL·계정은 로컬 기본값을 넣어뒀으니 보통은 DB_PASSWORD 만 설정하면 뜬다.

server:
  port: 8080

spring:
  application:
    name: lore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lore}
    username: ${DB_USERNAME:lore}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update = 엔티티를 보고 테이블을 자동 생성/변경. 개발 초기에만 쓴다.
      # 운영에서는 데이터가 날아갈 수 있으므로 validate 또는 none 으로 바꾼다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger UI 주소: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 상태 확인(헬스체크) 엔드포인트.
# /actuator/health 가 200 이면 서버가 정상. 배포 직후 확인·CI/CD 배포 성공 판정에 쓴다.
# 서버 내부 사정(DB 주소·디스크 등)이 밖으로 새지 않도록 상세 정보는 감춘다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 콘텐츠 이미지 S3 (presigned 업로드).
# 실제 업로드는 브라우저 → S3 직접(presigned PUT)이라 서버(t3.micro)를 안 거친다.
# 버킷 이름은 환경변수로 주입한다(로컬은 미설정 가능, EC2 는 배포 시 주입).
app:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    content-bucket: ${CONTENT_S3_BUCKET:}
    presign-expiry-minutes: ${S3_PRESIGN_EXPIRY:10}

  # 인증 (2026-09-01)
  #
  # ★ JWT_SECRET 이 유출되면 아무 사용자로든 토큰을 위조할 수 있다. 운영은 /etc/lore/lore.env
  #   에서 주입하고 절대 커밋하지 않는다. 아래 기본값은 로컬 개발 전용이며, 그 값이 그대로
  #   운영에 올라가면 부팅 시점에 경고가 남는다.
  # ★ HS256 은 최소 32바이트 키를 요구한다. 짧으면 서버가 뜨지 않는다.
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-in-production-32bytes}
    access-expiry: 30m
    refresh-expiry: 14d

  cookie:
    # 로컬은 http 라 Secure 쿠키가 브라우저에 저장되지 않는다 → 개발 시 false
    secure: ${COOKIE_SECURE:true}

  # 움짤(zzal) 생성 파이프라인 (2026-09-02)
  #
  # ★ 기본이 '가짜' 다 — 호출 한 번에 실제로 돈이 나간다($0.19).
  #   실수로 켜져 있는 것보다 실수로 꺼져 있는 편이 훨씬 낫다.
  zzal:
    pipeline-version: ${ZZAL_PIPELINE_VERSION:v1}
    max-hatch-attempts: 2

    # 개발용 시간 당기기 API(/api/zzal/v1/dev/**).
    #
    # ★★ 기본이 꺼짐이고, 꺼져 있으면 컨트롤러가 빈으로 올라오지 않아 주소 자체가 없다(404).
    #    주소에 /dev/ 가 들어가는 것은 방어가 아니다 — 코드가 올라와 있으면 언젠가 불린다.
    # ★ 운영에서는 켜지 않는다. 켜면 누구나 자기 펫의 시간을 마음대로 당길 수 있어
    #   기다림으로 이루어진 이 게임의 규칙이 통째로 무의미해진다.
    dev-tools: ${ZZAL_DEV_TOOLS:false}

    # 자는 동안 배울 동작 목록 — 쉼표로 구분한 동작 이름.
    #
    # ★ 이름은 동작 블록 파일명(zzal/prompt/{버전}/motions/{이름}.txt)과 정확히 같아야 한다.
    #   목록에 있는데 파일이 없으면 부팅이 막힌다(MotionCatalog).
    # ★ 비어 있으면 아무 동작도 굽지 않는다. 그게 기본값이다 — 동작 하나가 격자 한 장이라
    #   개수만큼 돈이 곱해지므로, 운영에서 실수로 켜지는 것보다 꺼져 있는 편이 낫다.
    #
    # 예) ZZAL_MOTIONS=교감1_머리쓰다듬,청소1_먼지떨이
    motions: ${ZZAL_MOTIONS:}

    recovery:
      # 서버가 뜰 때 "멈춘 알" 로 볼 기준(분). 한 번의 부화가 걸릴 수 있는 최대 시간
      # (10분)보다 넉넉히 잡는다 — 정상적으로 돌고 있는 부화를 집으면 두 번 굽게 되고
      # 돈이 두 배로 나간다.
      grace-minutes: 12

    generation:
      # OpenAI 실제 호출. 켜면 돈이 나간다
      real: ${ZZAL_GENERATION_REAL:false}
      # 파이썬 후처리 실제 실행. **돈이 안 든다**(우리 서버 안 계산)
      real-postprocess: ${ZZAL_REAL_POSTPROCESS:false}
      fake-delay-ms: ${ZZAL_FAKE_DELAY_MS:4000}
      # 가짜 이미지 클라이언트가 '격자' 자리에 내놓을 실제 파일.
      # 후처리를 과금 없이 검증하려면 진짜 격자가 필요하다.
      fake-grid-key: ${ZZAL_FAKE_GRID_KEY:}

    openai:
      # ★ 절대 커밋하지 않는다. 로컬은 ~/.claude/.env, 서버는 /etc/lore/lore.env 에서 주입.
      #   환경별로 다른 키를 쓴다 — 섞으면 dev 가 실험 한도를 먹고 원가 산정이 흐려진다.
      api-key: ${ZZAL_OPENAI_API_KEY:}

    python:
      # 후처리가 numpy·scipy·pillow 를 쓰므로 그것들이 깔린 파이썬이어야 한다.
      # 서버는 배포 때 만들어지는 가상환경(/opt/lore/venv/bin/python)을 가리킨다.
      bin: ${ZZAL_PYTHON_BIN:python3}
      timeout-seconds: 60
