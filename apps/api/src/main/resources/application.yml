# 서버 실행 설정.
#
# ★ 비밀번호는 이 파일에 직접 적지 않는다. 환경변수로만 주입한다.
#   이 파일은 깃에 올라가므로 값을 적으면 그대로 공개된다.
#
# 로컬 실행에 필요한 환경변수 (각자 자기 기계에 설정):
#   DB_URL       예) jdbc:postgresql://localhost:5432/lore
#   DB_USERNAME  예) lore
#   DB_PASSWORD  각자 로컬 DB 비밀번호
#
# URL·계정은 로컬 기본값을 넣어뒀으니 보통은 DB_PASSWORD 만 설정하면 뜬다.

server:
  port: 8080

spring:
  application:
    name: lore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lore}
    username: ${DB_USERNAME:lore}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update = 엔티티를 보고 테이블을 자동 생성/변경. 개발 초기에만 쓴다.
      # 운영에서는 데이터가 날아갈 수 있으므로 validate 또는 none 으로 바꾼다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger UI 주소: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
