<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE 편집실 — 결과물 미리보기</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/editor.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖌️</text></svg>">
</head>
<body class="ed">

<header class="ed-top">
  <a class="brand" href="/">
    <span class="brand-mark">L</span>
    <span class="brand-name">LORE</span>
    <span class="brand-sub">편집실</span>
  </a>

  <button type="button" class="ed-works-toggle" id="worksToggle"
          aria-expanded="true" aria-controls="edWorks">
    <span aria-hidden="true">☰</span> 작품
  </button>

  <div class="ed-title">
    <b id="edTitle">—</b>
    <span id="edMeta"></span>
  </div>

  <div class="ed-top-right">
    <span class="mock-badge" title="작품을 고르기 전까지는 샘플입니다. 크레딧과 다시 그리기는 흉내만 냅니다.">샘플</span>
    <div class="credit" id="creditBox">
      <span class="credit-icon">◈</span>
      <span class="credit-num" id="creditNum">1,240</span>
      <span class="credit-unit">크레딧</span>
    </div>
    <button type="button" class="btn btn-quiet btn-sm" id="ledgerBtn">사용 내역</button>
    <button type="button" class="btn btn-quiet btn-sm" id="saveBtn">저장</button>
    <!-- 얹은 것을 진짜 그림에 굽는다. 여기까지 와야 가져갈 것이 생긴다 —
         이 단추가 없던 동안, 배치한 말풍선은 브라우저 밖으로 나갈 길이 없었다. -->
    <button type="button" class="btn btn-primary btn-sm" id="bakeBtn">이미지로 뽑기</button>
  </div>
</header>

<!-- 구운 결과. 몇 장을 구웠는지, 무엇이 빠졌는지, 어디서 받는지. -->
<div class="bake-result" id="bakeResult" hidden></div>

<div class="ed-body">
  <!-- ============================================ 작품 목록 ============ -->
  <!-- 만들어 둔 웹툰 전부. 목록이 비어 있어도(아직 하나도 안 만든 사람) 자리를
       지운다 — 자리가 사라지면 "그런 기능이 없다"로 읽힌다. -->
  <aside class="ed-works" id="edWorks">
    <p class="ed-works-head">내 작품</p>
    <div id="worksList"></div>
  </aside>

  <!-- ============================================ 웹툰 스크롤 ========== -->
  <main class="ed-stage" id="stageCol">
    <div class="ed-stage-head">
      <div>
        <p class="eyebrow" id="edGenre"></p>
        <h1 id="edEpisode">1화</h1>
        <p class="ed-logline" id="edLogline"></p>
      </div>
      <label class="mini-toggle">
        <input type="checkbox" id="showOverlay" checked>
        <span>내가 얹은 것 보기</span>
      </label>
    </div>

    <div id="scenes"></div>

    <p class="ed-foot-note">
      여기까지가 1화입니다. 장 사이는 완성본과 같이 틈 없이 이어집니다.
    </p>
  </main>

  <!-- ============================================ 오른쪽 도구 ========== -->
  <aside class="ed-dock">
    <div class="dock-tabs" id="dockTabs">
      <button type="button" class="dock-tab is-on" data-tab="bubble">말풍선</button>
      <button type="button" class="dock-tab" data-tab="sticker">스티커</button>
      <button type="button" class="dock-tab" data-tab="sfx">효과음</button>
    </div>

    <div class="dock-hint" id="dockHint">
      항목을 누르면 <b id="activeSceneLabel">1번째 장</b> 위에 올라갑니다.
      끌어서 옮기고, 모서리로 크기를 바꾸고, 두 번 눌러 글자를 고치세요.
    </div>

    <div class="dock-grid" id="dockGrid"></div>

    <div class="dock-props" id="dockProps" hidden>
      <div class="dock-props-head">
        <b id="propTitle">선택한 요소</b>
        <button type="button" class="icon-btn" id="propClose" aria-label="선택 해제">✕</button>
      </div>
      <label class="field" id="propTextField">
        <span>글자</span>
        <textarea id="propText" rows="2"></textarea>
      </label>
      <div class="field" id="propTailField">
        <span>꼬리</span>
        <div class="seg" id="propTail">
          <button type="button" data-tail="left">◀ 왼쪽</button>
          <button type="button" data-tail="right">오른쪽 ▶</button>
          <button type="button" data-tail="none">없음</button>
        </div>
      </div>
      <label class="range"><span>크기</span><input type="range" id="propSize" min="6" max="70" step="1"></label>
      <label class="range"><span>너비</span><input type="range" id="propWide" min="8" max="96" step="1"></label>
      <label class="range"><span>기울기</span><input type="range" id="propRot" min="-30" max="30" step="1"></label>
      <div class="prop-btns">
        <button type="button" class="btn btn-quiet btn-sm" id="propFront">맨 앞으로</button>
        <button type="button" class="btn btn-quiet btn-sm" id="propDup">복제</button>
        <button type="button" class="btn btn-danger btn-sm" id="propDel">삭제</button>
      </div>
    </div>

    <div class="dock-ledger" id="dockLedger" hidden>
      <div class="dock-props-head"><b>크레딧 사용 내역</b>
        <button type="button" class="icon-btn" id="ledgerClose" aria-label="닫기">✕</button></div>
      <ul id="ledgerList"><li class="ledger-empty">아직 쓴 크레딧이 없습니다.</li></ul>
    </div>
  </aside>
</div>

<div class="toast" id="toast" hidden></div>
<div class="fly" id="fly" hidden></div>

<script src="/static/editor.js"></script>
</body>
</html>
