<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE — 웹툰을 만들고 있습니다</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
</head>
<body data-view="running">

<!-- 기다리는 화면 목업. index.html #progress 의 사본이라 마크업이 같아야
     한다 — 본편이 바뀌면 여기도 같이 고친다. 다른 것은 진행이 가짜라는
     것뿐이고, 화면에는 그 사실이 안 보인다. -->
<section id="progress" class="progress">
  <div class="progress-inner">

    <header class="progress-head">
      <div class="stage-art" id="stageArt" data-stage="story" aria-hidden="true"></div>
      <p class="stage-say" id="mascotLine">루가 이야기를 만들고 있어요</p>
      <div class="lou-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="louProgress">
        <div class="lou-bar"><i id="louBarFill"></i></div>
        <span class="lou-pct" id="louPct">0%</span>
      </div>
      <div class="progress-clock">
        <span class="clock-time" id="clock">0:00</span>
        <span class="clock-label">경과</span>
        <button type="button" class="btn btn-quiet btn-sm" onclick="location.href='/'">중단</button>
      </div>
    </header>

    <div class="play">
      <button type="button" class="mascot" id="mascot" aria-label="루를 쓰다듬기"></button>
      <p class="play-say" id="playSay">루를 눌러 보세요</p>
    </div>

  </div>
</section>

<script>
/* 데모 대본. app.js 는 안 부른다(여기 없는 요소를 배선하다 죽는다) —
   같은 동작을 작게 다시 쓴다. 본편 app.js 의 MASCOT_MOODS · LOU_REACT 와
   짝이 맞아야 한다. */
(() => {
  const $ = s => document.querySelector(s);
  const art = $("#stageArt"), say = $("#mascotLine");
  const mascot = $("#mascot"), playSay = $("#playSay");

  const STAGES = ["story", "sheet", "board", "art", "bind"];
  const SAY = {
    story: "루가 이야기를 만들고 있어요",
    sheet: "루가 캐릭터를 디자인하고 있어요",
    board: "루가 콘티를 짜고 있어요",
    art:   "루가 그림을 그리고 있어요",
    bind:  "루가 완성도를 확인하고 있어요",
  };
  const REACT = {
    click:      "앗! 지금 바빠요!",
    multiclick: "너무 많이 누르면 화날 거예요!",
    longpress:  "조금만 더 기다려주세요…",
    pet:        "헤헤~ 기분이 좋아요!",
  };

  let i = 0, pct = 2;
  const started = Date.now();

  function paint() {
    const k = STAGES[i];
    art.dataset.stage = k;
    say.textContent = SAY[k];
    $("#louBarFill").style.width = pct + "%";
    $("#louPct").textContent = pct + "%";
    $("#louProgress").setAttribute("aria-valuenow", String(pct));
  }

  // 진행 — 단계 경계를 넘으면 다음 단계로. 끝까지 가면 처음으로 돌아간다
  // (구경하는 화면이라 계속 돈다).
  setInterval(() => {
    pct += 1;
    const bound = (i + 1) / STAGES.length * 100;
    if (pct >= bound) {
      i += 1;
      if (i >= STAGES.length) { i = 0; pct = 2; }
    }
    paint();
  }, 700);

  setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000);
    $("#clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);

  // 노는 자리 — 반응은 여기서만. 위쪽 진행 문구는 안 건드린다.
  let clicks = 0, win = null, pressAt = 0, back = null;
  function react(kind) {
    mascot.dataset.react = kind;
    playSay.textContent = REACT[kind];
    clearTimeout(back);
    back = setTimeout(() => {
      delete mascot.dataset.react;
      playSay.textContent = "루를 눌러 보세요";
    }, kind === "multiclick" ? 2200 : 1800);
  }
  mascot.addEventListener("pointerdown", () => { pressAt = Date.now(); });
  mascot.addEventListener("pointerup", () => {
    const held = Date.now() - pressAt;
    if (pressAt && held > 600) { react("longpress"); pressAt = 0; return; }
    pressAt = 0;
    clicks += 1;
    clearTimeout(win);
    win = setTimeout(() => { clicks = 0; }, 2000);
    react(clicks >= 3 ? "multiclick" : (clicks === 2 ? "pet" : "click"));
  });

  paint();
})();
</script>
</body>
</html>
