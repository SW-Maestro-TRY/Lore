<?xml version="1.0" encoding="UTF-8"?>
<!--
  루(LOU) 로고 마크 — 기하학 도형만으로 그린 고래 실루엣.

  2026-08-24 에 헤더 로고를 실제 루 그림(design-reference/expressions)으로
  바꾸면서 제품에서는 내렸다. 버리지 않고 여기에 남겨 둔다 — 그림 로고가
  못 쓰이는 자리에서는 이쪽이 낫다:

  - 아주 작은 자리(16px 파비콘, 앱 아이콘 뱃지) — 그림은 뭉개지는데 이건 안 뭉갠다
  - 한 색으로만 찍어야 하는 자리(도장, 워터마크, 흑백 인쇄, 자수)
  - 바탕색을 따라가야 하는 자리 — 몸통이 전부 currentColor 라, 감싼 요소의
    color 만 바꾸면 통째로 물든다

  쓰는 법: 몸통 색은 부모의 color(currentColor), 눈은 --brand-bg 로 뚫는다.
  단색으로 찍을 때는 눈의 fill 을 바탕색으로 바꾸면 된다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="LORE 루 로고">
  <!-- 꼬리 -->
  <path fill="currentColor" d="M20 16l9.2-6c.7-.5 1.6.1 1.4 1l-1.7 5 1.7 5c.2.9-.7 1.5-1.4 1l-9.2-6z"/>
  <!-- 등지느러미 -->
  <path fill="currentColor" d="M10.6 9.2c.9-4.4 3-7.1 6.2-8-.9 3.2-.5 6 1.3 8.4-2.5-.6-5-.7-7.5-.4z"/>
  <!-- 몸통 -->
  <ellipse cx="13" cy="16" rx="11" ry="8.4" fill="currentColor"/>
  <!-- 가슴지느러미 -->
  <path fill="currentColor" d="M9.6 23.2c-.9 2.5-.3 4.5 1.7 5.4.5-2.2 1.6-3.8 3.1-4.7-1.6 0-3.2-.2-4.8-.7z"/>
  <!-- 눈은 색을 얹지 않고 바탕색으로 뚫는다 — 흰 고래에 흰 눈이면 사라진다 -->
  <circle cx="7.2" cy="14.2" r="1.25" fill="var(--brand-bg, #6fa599)"/>
</svg>
