
# =============================================================================
# 캐릭터 일관성 비교 실험 설정
# 코드를 고치지 않고 이 파일만 바꿔서 재실행하세요.
# =============================================================================

provider:
  name: gemini              # providers/ 에 등록된 이름 (gemini | mock)
  model: gemini-3-pro-image-preview
  api_key_env: GEMINI_API_KEY   # .env 에서 읽을 키 이름
  cost_per_image_usd: 0.134     # 이미지 1장당 추정 단가. 요금표 바뀌면 여기만 수정
  options:
    # generationConfig 로 그대로 전달됨. 모델이 지원 안 하는 값은 지우세요.
    response_modalities: ["TEXT", "IMAGE"]
    aspect_ratio: "1:1"      # 1:1, 3:4, 4:3, 9:16, 16:9 ...
    image_size: "2K"         # 1K | 2K | 4K (gemini-2.5-flash-image 는 지원 안 함 → 삭제)
    timeout_sec: 300

pricing:
  usd_to_krw: 1400          # 비용 안내 문구용 환율

limits:
  max_total_calls: 60       # 이번 실행의 총 호출 상한. 넘으면 실행 전에 중단

retry:
  max_retries: 2            # 실패 건당 재시도 횟수 (총 시도 = 1 + max_retries)
  backoff_sec: 5            # 재시도 전 대기 (시도마다 x2)

repeats: 2                  # 조건 x 장면 당 반복 횟수

# -----------------------------------------------------------------------------
# 프롬프트 조립 방식. 아래 placeholder 만 사용 가능:
#   {character} {scene} {style} {extra}
# -----------------------------------------------------------------------------
prompt_template: |
  {character}

  Scene: {scene}

  {style}
  {extra}

character_prompt: >-
  A 24-year-old East Asian woman named Yuna. Shoulder-length wavy dark brown hair
  with a blunt fringe. Oval face, single-lidded almond eyes with a slight downturn
  at the outer corners, small straight nose, thin lips. A small mole under her left
  eye. She wears round thin-rimmed silver glasses, a mustard-yellow oversized knit
  cardigan over a white cotton tee, dark blue straight-leg jeans, and white canvas
  sneakers. Slim build, 165cm.

style_suffix: >-
  Style: soft natural lighting, semi-realistic illustration, muted warm color
  palette, clean line work, shallow depth of field, full body visible unless the
  scene says otherwise.

scenes:
  - id: s1_cafe
    prompt: >-
      Sitting alone at a window seat in a quiet cafe on a rainy afternoon,
      holding a warm mug with both hands, looking out at the wet street.
  - id: s2_street
    prompt: >-
      Walking briskly down a busy neon-lit city street at night, carrying a tote
      bag over one shoulder, glancing back over her shoulder.
  - id: s3_office
    prompt: >-
      Standing in a bright open-plan office, presenting to two colleagues in front
      of a whiteboard, mid-gesture with one hand raised.
  - id: s4_park
    prompt: >-
      Crouching on a grass lawn in a park at golden hour, petting a small brown
      dog, laughing.
  - id: s5_kitchen
    prompt: >-
      Cooking at a small apartment kitchen counter in the early morning, sleeves
      pushed up, chopping vegetables, steam rising from a pot behind her.

# -----------------------------------------------------------------------------
# 실험 조건
#   refs               : 매 호출마다 첨부할 고정 레퍼런스 이미지 (refs/ 폴더)
#   use_previous_scene : 직전 장면의 생성 결과를 추가로 첨부 (조건 D)
#   sequential         : true 면 반드시 순차 실행 (직전 결과 의존)
#   extra              : 프롬프트 끝에 붙는 조건별 추가 지시문 ({extra})
# -----------------------------------------------------------------------------
conditions:
  A:
    label: "텍스트만"
    refs: []
    use_previous_scene: false
    sequential: false
    extra: ""

  B:
    label: "얼굴 클로즈업 1장"
    refs: ["refs/face_closeup.png"]
    use_previous_scene: false
    sequential: false
    extra: >-
      The attached image is a reference photo of this exact character's face.
      Keep her facial features, hair color and hairstyle identical to the
      reference.

  C:
    label: "턴어라운드 시트"
    refs: ["refs/turnaround.png"]
    use_previous_scene: false
    sequential: false
    extra: >-
      The attached image is a character turnaround sheet of this exact character.
      Keep her face, hairstyle, body proportions and outfit details identical to
      the sheet.

  D:
    label: "턴어라운드 + 직전 장면"
    refs: ["refs/turnaround.png"]
    use_previous_scene: true
    sequential: true
    extra: >-
      The first attached image is a character turnaround sheet of this exact
      character. The second attached image is the previous scene featuring the
      same character. Keep her face, hairstyle, body proportions and outfit
      details consistent with both references.

# =============================================================================
# 그림체(스타일) 비교 실험 — python run.py --style-test
#
# 위쪽 conditions 실험과 변수가 반대다.
#   캐릭터 일관성 실험 : 스타일 고정, 레퍼런스 방식(A~D)이 변수
#   그림체 실험        : 레퍼런스 없음, 스타일 문구가 변수
#
# 주의: 이 실험은 style_suffix 를 쓰지 않는다. 고정 스타일 문구가 같이 들어가면
#       측정하려는 변수(styles[].prompt)와 섞여서 비교가 무의미해진다.
#
# 출력: outputs/style/{style_id}_r{n}.png, outputs/style_compare.html
# =============================================================================
style_test:
  # 모든 스타일이 공유하는 고정 장면. 이것만 같으면 차이는 전부 스타일 문구 탓이다.
  scene: >-
    17-year-old girl sitting at classroom desk, morning light, upper body,
    looking at viewer
  # 참고: 위 장면의 "17-year-old" 는 character_prompt 의 "24-year-old" 와 충돌한다.
  #      나이 신호를 하나로 맞추려면 아래 줄로 교체할 것.
  # scene: >-
  #   Sitting at a classroom desk, morning light, upper body, looking at viewer

  repeats: 6                # 스타일당 장수. 6종 x 6회 = 36장

  # {character} {scene} {style} 만 사용 가능
  prompt_template: |
    {character}

    Scene: {scene}

    Art style: {style}

  styles:
    - id: f1_s5base
      prompt: "Korean webtoon romance style, soft flat colors, thin clean lines, minimal shading"
    - id: f2_simple
      prompt: "Korean webtoon romance style, soft flat colors, thin clean lines, minimal shading, simplified anime face, dot nose, simple line mouth, large stylized eyes, no realistic facial features"
    - id: f3_flat_face
      prompt: "Korean webtoon romance style, soft flat colors, thin clean lines, minimal shading, flat 2D face, minimal nose drawn as single short line, eyes drawn with simple shapes, no photorealistic skin texture, no detailed lips"
    - id: f4_shoujo
      prompt: "Korean webtoon romance style, soft flat colors, thin clean lines, minimal shading, shoujo manga face proportions, big expressive eyes, tiny simplified nose and mouth, hand-drawn illustration"
    - id: f5_negative
      prompt: "Korean webtoon romance style, soft flat colors, thin clean lines, minimal shading, stylized cartoon face. NOT photorealistic, NOT semi-realistic, no detailed nostrils, no realistic lip texture, no skin pores, no 3d render"
    - id: f6_artist
      prompt: "sweet romance manhwa illustration, in the style of popular Naver romance webtoon, cute stylized character face, dot nose, simple mouth, flat pastel coloring, clean digital lineart"

