# PR 검사 — 머지되면 기동·배포가 깨지는 것들을 PR 단계에서 잡는다.
#   1) 서버 명세 ↔ 프론트 타입 (계약)
#   2) 마이그레이션 번호 중복 (DB)
#
# ★ 왜 배포 워크플로가 아니라 여기인가
#   `deploy.yml` 은 `on: push: branches:[develop]` 이라 **머지된 뒤에** 돈다. 거기서 막으면
#   어긋난 PR 은 이미 들어간 뒤고 배포만 실패한다 — 막고 싶은 것을 못 막는다. 게다가 그쪽
#   프론트 잡은 세 도메인(zzal·webtoon·haeun)을 한 번에 빌드해서, zzal 계약이 어긋나면
#   팀원 화면 배포까지 같이 멈춘다. 그래서 PR 에서 도는 파일을 따로 둔다.
#
# ★ 1) 계약 — 무엇을 보는가
#   `common/docs/openapi.json`(백엔드가 갱신해 커밋하는 서버 명세 스냅샷)에서 타입을 다시 뽑아,
#   커밋된 `zzal/fe/lib/api-schema.ts` 와 한 글자라도 다르면 빨간불.
#
#   서버를 바꾸고 스냅샷을 안 갱신  → 백엔드 스냅샷 시험이 빨개진다
#   스냅샷은 갱신했는데 타입을 안 갱신 → 이 검사가 빨개진다
#
# ★ 2) 마이그레이션 — 무엇을 보는가
#   마이그레이션 폴더 셋(`apps/api` · `trailer/be` · `webtoon/be`)은 실행될 때 classpath
#   `db/migration` 한 곳으로 합쳐진다. 번호가 겹치면 Flyway 가 기동을 멈춘다.
#   `scripts/check-migrations.sh` 가 번호 중복·이름 형식을 본다(규칙은 git-convention.md 9절).
#
# ⚠️ 이 검사를 **통과해야 머지 가능**으로 만드는 것은 깃허브 레포 설정(Branch protection)이라
#    워크플로 파일로는 안 된다. 설정에서 켜기 전까지는 빨간불만 뜨고 머지는 된다.

name: PR 검사

on:
  pull_request:
    # develop 뿐 아니라 staging·main 도 본다. 마이그레이션은 두 줄기로 들어가므로
    # develop 에서만 막으면 staging 으로 직행한 PR 이 그대로 새 나간다.
    branches: [develop, staging, main]
    paths:
      - 'common/docs/openapi.json'
      - 'zzal/fe/lib/api-schema.ts'
      - 'scripts/gen-api-types.sh'
      - '.github/workflows/contract.yml'
      - '**/src/main/resources/db/migration/**'
      - 'scripts/check-migrations.sh'

jobs:
  # 위 paths 는 워크플로 전체에 걸리므로, 잡마다 자기 관심사만 보도록 한 번 더 가른다.
  # (마이그레이션만 고친 PR 에서 타입 검사가 도는 것을 막는다 — 그 반대도 마찬가지.)
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:        ${{ steps.filter.outputs.api }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'common/docs/openapi.json'
              - 'zzal/fe/lib/api-schema.ts'
              - 'scripts/gen-api-types.sh'
              - '.github/workflows/contract.yml'
            migrations:
              - '**/src/main/resources/db/migration/**'
              - 'scripts/check-migrations.sh'
              - '.github/workflows/contract.yml'

  api-types:
    name: 서버 명세 ↔ 프론트 타입
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 명세에서 타입 다시 뽑기
        run: ./scripts/gen-api-types.sh

      - name: 커밋된 타입과 같은지
        run: |
          if ! git diff --quiet -- zzal/fe/lib/api-schema.ts; then
            echo "::error file=zzal/fe/lib/api-schema.ts::서버 명세와 프론트 타입이 어긋났습니다. 아래를 돌려 생성물을 같이 커밋하세요 — ./scripts/gen-api-types.sh"
            echo
            echo "── 어긋난 곳 ──"
            git --no-pager diff -- zzal/fe/lib/api-schema.ts
            exit 1
          fi
          echo "✅ 서버 명세와 프론트 타입이 같습니다."

  # ★ 왜 PR 에서 보나 — 마이그레이션 세 폴더(apps/api · trailer/be · webtoon/be)는 실행될 때
  #   classpath `db/migration` 한 곳으로 합쳐진다. 번호가 겹치면 Flyway 가 기동을 멈추고 API 가
  #   안 뜬다. 머지된 뒤에 알면 그때는 이미 dev 가 죽어 있다(2026-09-22 V23 중복 사고).
  migrations:
    name: 마이그레이션 번호
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      # 기준 브랜치와 견줘 "이번에 새로 더한 파일"을 가리려면 얕은 체크아웃으로는 부족하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 번호 중복·이름 형식
        run: ./scripts/check-migrations.sh --base "origin/${{ github.base_ref }}"
