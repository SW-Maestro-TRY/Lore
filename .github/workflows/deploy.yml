# 배포 (CI/CD) — SSM 방식
#
# develop 에 머지되면 바뀐 곳만 자동 배포한다.
#   백엔드(**/be, apps/api …) → jar 빌드 → S3 → SSM → lore-api 재시작
#   프론트(**/fe, apps/web)   → standalone 빌드 → S3 → SSM → lore-web 재시작 → CloudFront 무효화
#
# 서버 포트는 하나도 안 연다. SSM 은 서버가 밖으로 나가서 명령을 받아오는 방식이라
# 인바운드가 필요 없다.
#
# 서버에서 실제로 실행되는 절차는 /opt/lore/deploy-api.sh · deploy-web.sh 에 있다.
# 워크플로에 인라인으로 박지 않는 이유: 절차를 서버 쪽 파일로 두면 나중에
# CodeDeploy 로 옮길 때 같은 스크립트를 그대로 부르면 된다.

name: Deploy to EC2

on:
  push:
    branches: [develop]
    paths:
      - 'common/**'
      - 'comic/**'
      - 'webtoon/**'
      - 'trailer/**'
      - 'apps/**'
      # Webtoon 탭 화면의 원본. 여기만 고쳐도 프론트가 바뀐다
      # (빌드가 apps/web/public 으로 떠 온다 — webtoon/fe/sync-landing.sh).
      - 'haeun/landing/web/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write     # OIDC 신분증 발급 (AWS 명찰 걸기용)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ROLE_ARN: arn:aws:iam::046797548177:role/lore-github-deploy
  S3_BUCKET: lore-deploy-046797548177-ap-northeast-2-an
  INSTANCE_ID: i-0204d071a9c94bc08
  CF_DISTRIBUTION_ID: E2DQOZKTRM3UGJ

jobs:
  # 바뀐 영역을 먼저 판별한다. 프론트만 고쳤는데 백엔드까지 빌드하면
  # 배포가 2배 느려지고 멀쩡한 서버를 괜히 재시작하게 된다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'common/be/**'
              - 'comic/be/**'
              - 'webtoon/be/**'
              - 'trailer/be/**'
              - 'apps/api/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            frontend:
              - 'common/fe/**'
              - 'comic/fe/**'
              - 'webtoon/fe/**'
              - 'trailer/fe/**'
              - 'apps/web/**'
              - 'haeun/landing/web/**'
              - 'package.json'
              - 'package-lock.json'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 준비 (+ Gradle 캐시)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: gradlew 실행권한
        run: chmod +x ./gradlew

      - name: 빌드 (테스트 제외)
        run: ./gradlew clean build -x test

      - name: 배포용 jar 한 개로 추리기
        run: |
          jar=$(ls build/libs/*.jar | grep -v plain)
          cp "$jar" build/libs/app.jar

      - name: AWS 명찰 걸기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: jar 를 S3 에 업로드
        run: |
          KEY="builds/api-${GITHUB_SHA}.jar"
          echo "S3_KEY=$KEY" >> "$GITHUB_ENV"
          aws s3 cp build/libs/app.jar "s3://$S3_BUCKET/$KEY" --region "$AWS_REGION"

      - name: SSM 으로 배포 (포트 안 엶)
        run: |
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy api ${GITHUB_SHA}" \
            --parameters commands="[\"sudo /opt/lore/deploy-api.sh $S3_BUCKET $S3_KEY $AWS_REGION\"]" \
            --query "Command.CommandId" --output text)
          echo "command-id: $CMD_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "===== 서버 출력 ====="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "배포 상태: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "===== 에러 출력 ====="
            aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 준비 (+ npm 캐시)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      # standalone 산출물은 server.js 와 최소 node_modules 만 담고 있다.
      # static/public 은 별도로 복사해야 한다 — Next 가 그렇게 나눠 내보낸다.
      - name: 번들 묶기
        run: |
          rm -rf bundle && mkdir -p bundle
          cp -r apps/web/.next/standalone/. bundle/
          mkdir -p bundle/apps/web/.next
          cp -r apps/web/.next/static bundle/apps/web/.next/static
          [ -d apps/web/public ] && cp -r apps/web/public bundle/apps/web/public || true
          tar czf web.tar.gz -C bundle .
          ls -lh web.tar.gz

      - name: AWS 명찰 걸기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 번들을 S3 에 업로드
        run: |
          KEY="builds/web-${GITHUB_SHA}.tar.gz"
          echo "S3_KEY=$KEY" >> "$GITHUB_ENV"
          aws s3 cp web.tar.gz "s3://$S3_BUCKET/$KEY" --region "$AWS_REGION"

      - name: SSM 으로 배포
        run: |
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy web ${GITHUB_SHA}" \
            --parameters commands="[\"sudo /opt/lore/deploy-web.sh $S3_BUCKET $S3_KEY $AWS_REGION\"]" \
            --query "Command.CommandId" --output text)
          echo "command-id: $CMD_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "===== 서버 출력 ====="
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text
          echo "배포 상태: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "===== 에러 출력 ====="
            aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text
            exit 1
          fi

      # SSR 페이지는 캐시하지 않지만 /_next/static/* 은 캐시한다.
      # 파일명에 해시가 붙어 있어 무효화가 꼭 필요하진 않으나,
      # 배포 직후 옛 자원이 남는 경우가 있어 한 번 비운다.
      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" --output text
